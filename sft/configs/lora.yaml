model_id: Qwen/Qwen3-VL-8B-Instruct

# Output
output_dir: checkpoints/lora
run_name: sft-lora
report_to: ["wandb"]

# Liger fused linear+CE allows training on full-length sequences.
use_liger_kernel: true

# Training schedule
epochs: 5
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 1.0e-4
weight_decay: 0.01
warmup_ratio: 0.05
lr_scheduler_type: cosine
logging_steps: 10
save_total_limit: 5
save_only_model: true

# Data
fps: 2.0
max_pixels: 112896
max_text_len: 16384
dataloader_num_workers: 2

# LoRA
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
