### model
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
image_max_pixels: 262144
video_max_pixels: 16384
video_fps: 2.0
video_maxlen: 64
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_target: all

### dataset
dataset: anim2code_train
eval_dataset: anim2code_val
dataset_dir: sft/data   # path to directory containing dataset_info.json + train.json/val.json
template: qwen3_vl_nothink
cutoff_len: 16384
preprocessing_num_workers: 8
dataloader_num_workers: 2

### output
output_dir: checkpoints/lora_sft   # set to your desired checkpoint directory
logging_steps: 5
save_strategy: epoch
eval_strategy: epoch
per_device_eval_batch_size: 1
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: qwen3vl-8b-lora-sft

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
