model_id: Qwen/Qwen3-VL-8B-Instruct

# Output
output_dir: checkpoints/full
run_name: sft-full
report_to: ["wandb"]

# Training schedule (full FT — smaller LR, more accumulation)
epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
learning_rate: 1.0e-5
weight_decay: 0.01
warmup_ratio: 0.03
lr_scheduler_type: cosine
logging_steps: 10
save_total_limit: 4

# Vision tower stays frozen for full FT to fit in memory.
freeze_vision: true

# Data
fps: 1.0
max_pixels: 112896
max_text_len: 4096
dataloader_num_workers: 2
