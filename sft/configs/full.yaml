model_id: Qwen/Qwen3-VL-8B-Instruct

output_dir: checkpoints/full
run_name: sft-full
report_to: ["wandb"]

epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
learning_rate: 1.0e-5
weight_decay: 0.01
warmup_ratio: 0.03
lr_scheduler_type: cosine
logging_steps: 10
save_total_limit: 2
save_only_model: true

deepspeed: configs/ds_z3.json

# Keep the vision tower frozen to fit in memory.
freeze_vision: true

fps: 2.0               # frames per second sampled from each video
max_pixels: 112896     # pixels per frame, 336*336
max_text_len: 16384    # truncation length, including video tokens
dataloader_num_workers: 2
