# Each stage selects its own model: gemini or qwen3vl.
dataset:
  local_dir: anim2code_data/data/test

max_iterations: 3      # refinement rounds after iter_0
retries: 1             # retries per stage on error
retry_backoff_s: 5     # wait between retries, doubled each attempt

recorder:
  fps: 12
  duration: 10         # seconds
  width: 1024
  height: 768

generator:
  model: gemini
  gemini:
    model_id: gemini-3-flash-preview
    fps: 5             # frames per second sampled from the video
    temperature: 0.0
    max_output_tokens: 65536
  qwen3vl:
    model_id: Qwen/Qwen3-VL-8B-Instruct
    fps: 2.0
    max_pixels: 112896   # 336*336
    max_new_tokens: 8192
    temperature: 0.2
    top_p: 0.9

critic:
  model: gemini
  gemini:
    model_id: gemini-3-flash-preview
    fps: 5
    temperature: 0.0
    max_output_tokens: 8192
  qwen3vl:
    model_id: Qwen/Qwen3-VL-8B-Instruct
    fps: 2.0
    max_pixels: 112896
    max_new_tokens: 2048
    temperature: 0.0
    top_p: 1.0

editor:
  model: gemini
  include_target_video: false  # also pass the gold video to the editor
  gemini:
    model_id: gemini-3-flash-preview
    fps: 5
    temperature: 0.2
    max_output_tokens: 65536
  qwen3vl:
    model_id: Qwen/Qwen3-VL-8B-Instruct
    fps: 2.0
    max_pixels: 112896
    max_new_tokens: 8192
    temperature: 0.2
    top_p: 0.9
