dataset:
  local_dir: anim2code_data/data/test

max_iterations: 3      # refinement rounds after iter_0
retries: 1             # retries per stage on error
retry_backoff_s: 5     # wait between retries, doubled each attempt

recorder:
  fps: 12
  duration: 10         # seconds
  width: 1024
  height: 768

generator:
  model: qwen3vl
  qwen3vl:
    model_id: Qwen/Qwen3-VL-8B-Instruct
    fps: 2.0
    max_pixels: 112896   # 336*336
    max_new_tokens: 8192
    temperature: 0.2
    top_p: 0.9

critic:
  model: qwen3vl
  qwen3vl:
    model_id: Qwen/Qwen3-VL-8B-Instruct
    fps: 2.0
    max_pixels: 112896
    max_new_tokens: 2048
    temperature: 0.0
    top_p: 1.0

editor:
  model: qwen3vl
  include_target_video: false  # ignored by Qwen3-VL
  qwen3vl:
    model_id: Qwen/Qwen3-VL-8B-Instruct
    fps: 2.0
    max_pixels: 112896
    max_new_tokens: 8192
    temperature: 0.2
    top_p: 0.9
